<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- From Enter to Pixels: an Enter (return) key arrow built from pixels, on a dark tile that reads in light and dark tab bars. -->
  <rect width="32" height="32" rx="7" fill="#122130"/>
  <g fill="#5BC0E4">
    <rect x="23.5" y="7" width="3" height="12"/>
    <rect x="14.5" y="16" width="9" height="3"/>
  </g>
  <g fill="#F0A447">
    <rect x="5.5" y="16" width="3" height="3"/>
    <rect x="8.5" y="13" width="3" height="9"/>
    <rect x="11.5" y="10" width="3" height="15"/>
  </g>
</svg>
